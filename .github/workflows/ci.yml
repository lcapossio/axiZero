name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  # Verilator versions this project is validated against. SpinalHDL 1.10.1
  # segfaulted on 5.048 (see no_commit/BUGS.md #3), so an unpinned runner
  # image can silently reintroduce that class of failure. Assert the version
  # instead of trusting whatever apt serves.
  VERILATOR_EXPECTED: '5.0'
  # Unpinned ruff drifts its default rule set: 0.16.0 reports 114 findings
  # on a tree that 0.14.2 passes clean. Pin it so lint is deterministic.
  RUFF_VERSION: '0.14.2'

jobs:
  # ── SpinalHDL compilation + SpinalSim unit tests ──────────────────────────
  spinal-sim:
    name: SpinalSim (sbt test)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-sbt

      - name: Install Verilator
        run: |
          sudo apt-get install -y --no-install-recommends verilator
          verilator --version
          verilator --version | grep -q "Verilator ${VERILATOR_EXPECTED}" || {
            echo "::error::Verilator drifted from ${VERILATOR_EXPECTED}.x - see no_commit/BUGS.md #3"
            exit 1
          }

      - name: Compile (SpinalHDL)
        run: sbt compile

      - name: Check formatting (scalafmt)
        run: sbt scalafmtCheck

      - name: Run scalafix
        run: sbt "scalafix --check"

      - name: Coverage report (SpinalSim)
        # -Dcoverage=true must be set at JVM startup so scalacOptions are
        # evaluated correctly; coverageTest = test + coverageReport.
        run: sbt -Dcoverage=true coverageTest

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: scoverage-report
          path: target/scala-2.13/scoverage-report/

      - name: Generator smoke test (axizero.py)
        run: |
          pip install pyyaml
          python3 scripts/axizero.py generate scripts/example.yaml

  # ── cocotb integration tests against pre-built generated Verilog ──────────
  cocotb:
    name: cocotb (generated Verilog)
    runs-on: ubuntu-24.04
    # Checked 2026-05-01: keep cocotb 1.9.2 until cocotbext-axi supports cocotb 2.x.
    # Track: https://github.com/alexforencich/cocotbext-axi/issues/119

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-sbt

      - name: Install Verilator
        run: |
          sudo apt-get install -y --no-install-recommends verilator
          verilator --version
          verilator --version | grep -q "Verilator ${VERILATOR_EXPECTED}" || {
            echo "::error::Verilator drifted from ${VERILATOR_EXPECTED}.x - see no_commit/BUGS.md #3"
            exit 1
          }

      - name: Install Python dependencies
        run: pip install "cocotb==1.9.2" "cocotbext-axi @ git+https://github.com/alexforencich/cocotbext-axi@b2d126c4bc0f4cafa6e2fd3cdcfafc333e716a9a" pyyaml

      - name: Lint Python (ruff)
        run: |
          pip install "ruff==${RUFF_VERSION}"
          ruff --version
          ruff check scripts/ sim/ hw/

      - name: Run cocotb tests (lite + full + wrr + qos + ipif + axis)
        run: python3 sim/cocotb_gen/run_all.py

  generated-rtl:
    name: Generated RTL up to date
    runs-on: ubuntu-24.04
    # The netlists under generated/ are tracked, and the cocotb suites run
    # against them. Nothing previously noticed when they drifted from the
    # generators: the SpinalHDL 1.10.1 -> 1.14.2 move regenerated the Arty
    # netlists but left these behind, and the suites kept passing against
    # output from a generator version the project no longer used.

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-sbt

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Regenerate tracked netlists
        run: |
          python3 scripts/axizero.py generate scripts/example.yaml --output generated
          sbt "runMain axizero.gen.AxiZeroGen"

      - name: Compare against the committed netlists
        run: python3 scripts/check_generated.py

  formal:
    name: Formal checks
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/setup-sbt

      - name: Set up OSS CAD Suite
        uses: YosysHQ/setup-oss-cad-suite@v3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Python dependencies
        run: pip install pyyaml

      - name: Generate AXIS formal RTL
        run: |
          mkdir -p tmp/axis_formal
          cat > tmp/axis_formal/config.yaml <<'EOF'
          designs:
            - name: SmokeAxisRegSlice
              kind: axis
              core: reg_slice
              data_width: 32
              use_keep: true
              use_last: true
          EOF
          python3 scripts/axizero.py generate tmp/axis_formal/config.yaml --output tmp/axis_formal/rtl

      # One step per proof, so a failure in one cannot hide the result of
      # another. Run as a single block, the first failure aborted the step and
      # the AXIS proof below never ran at all.
      # write_response_routing.sby is not run here. It now elaborates and
      # solves - the DUT mismatch that used to stop it is fixed - but its
      # environment model is unsound: the slave response channels are free
      # wires and the crossbar's request outputs to the slaves are left
      # unconnected, so the solver invents an R beat no master ever asked for
      # and any correct crossbar fails. Making it meaningful means modelling
      # the slaves, not adjusting an assertion. Tracked as BUGS.md #23.
      - name: Formal proof - AXIS ready/valid reg slice
        working-directory: formal
        run: sby -f axis_ready_valid_regslice.sby
